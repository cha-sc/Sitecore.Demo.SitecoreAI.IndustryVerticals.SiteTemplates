      Hint: PromoDescription
      Value: "<p>Abby was born almost two decades ago with hypoplastic left heart syndrome, a rare condition that was often fatal at that time. She had multiple heart-repair surgeries, but they weren’t enough... Thanks to a groundbreaking heart transplant 19 years later, she is living life to the full, embracing a career, travel, sports, a relationship and advocacy.</p>"
