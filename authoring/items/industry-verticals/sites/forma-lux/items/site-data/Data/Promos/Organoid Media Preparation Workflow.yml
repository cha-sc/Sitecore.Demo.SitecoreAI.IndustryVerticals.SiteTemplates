    - ID: "4fc0c7b3-bcfb-4a9d-834d-59f6836e5fd6"
      Hint: PromoDescription
      Value: |
        <div class="ck-content"><p><strong>Figure 1: Organoid medium made easy.</strong> To use an organoid growth kit, simply add the appropriate volume of basal medium to the vials included in the kit, and vortex to mix well. Pipette the reconstituted kit components into the basal medium and add the appropriate volume of conditioned medium. Pass this mixture through a bottle-top filter unit, and you&rsquo;re ready to feed your organoids!</p><p>Organoid technology is subject to various patent rights; please consult your patent counsel regarding the need for licenses, including without limitation for uses beyond the scope permitted by the HUB Addendum to the ATCC MTA.</p></div>
