    - ID: "581d7a02-ce94-4a73-9add-258867a8b60f"
      Hint: Content
      Value: "<p>Buying your first home is exciting — but it can also feel overwhelming. From saving for a down payment to understanding mortgage options and closing costs, there’s a lot to keep track of.</p><p>That’s why CMHC created a simple, step-by-step First-Time Home Buyer Checklist.</p><p>Inside, you’ll discover:</p><ul><li>What to budget for beyond your down payment</li><li>How to prepare your finances before applying for a mortgage</li><li>Key questions to ask lenders and real estate professionals</li><li>Important steps from house hunting to closing day</li><li>Available tax credits, rebates, and other financing options</li></ul><p>Download your free checklist and move forward with clarity and confidence.</p>"
