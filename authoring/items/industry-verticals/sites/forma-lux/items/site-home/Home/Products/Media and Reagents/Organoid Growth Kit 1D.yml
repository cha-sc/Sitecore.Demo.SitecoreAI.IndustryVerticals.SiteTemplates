      Hint: LongDescription
      Value: |
        <div class="ck-content"><p>ATCC Growth Kits are packages of recombinant proteins, small molecules and other supplements designed to make the preparation of complex media formulations for select organoid culture models easy and reliable. Kit components are supplied as powders to maximize stability and in convenient, pre-portioned, ready-to-reconstitute format that does not require aliquoting or storage once prepared.</p></div>
