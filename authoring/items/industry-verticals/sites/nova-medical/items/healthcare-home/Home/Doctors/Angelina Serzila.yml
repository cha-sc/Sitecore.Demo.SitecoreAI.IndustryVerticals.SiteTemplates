    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.25rem;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">For more than 15 years, Jonathan has advised private equity sponsors, investment funds, and multinational corporations on complex international mergers and acquisitions, private equity transactions, and investment fund formations and structurings. He has particular experience at the intersection of tax, transactional execution and fund advisory work, guiding clients through the full investment lifecycle—from fundraise and deployment to portfolio build‑out, exits and secondary processes. Known for his pragmatic style and calm leadership on high‑stakes matters, Jonathan regularly navigates multi‑jurisdictional issues, sophisticated capital structures, and cross‑border transactions.</p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Through a 2017 secondment at a private equity firm, Jonathan gained a first-hand perspective on sponsor priorities and investment committee decision-making, which informs his work today.</p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Jonathan was mentor at the International University Campus of Paris (Cité Internationale Universitaire de Paris), reflecting his commitment to developing the next generation of business and legal talent.</p></div>
