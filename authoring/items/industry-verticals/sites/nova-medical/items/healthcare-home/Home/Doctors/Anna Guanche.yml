        <div class="ck-content"><p><span style="color:rgb(0,0,0);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Scott Abramowitz is a partner in Ropes &amp; Gray’s private equity transactions practice group, based in New York. He has broad experience representing private equity funds, their portfolio companies and corporate clients in a wide variety of complex business transactions, including mergers, acquisitions, recapitalizations, leveraged buyouts, growth equity financings, joint ventures and other investment transactions. He also regularly counsels clients on general corporate matters and corporate governance. Scott has advised on transactions across many industries, including business services and technology, health care, financial services and industrials.</span></span></p></div>
