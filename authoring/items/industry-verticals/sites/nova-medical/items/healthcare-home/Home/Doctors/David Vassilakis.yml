    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.25rem;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Ama Adams is a leading international trade and national security lawyer with more than two decades of experience guiding companies and investors through complex cross-border risks and U.S. regulatory regimes. As managing partner of the Washington, D.C. office and co-chair of the firm’s national security practice, she advises on the full spectrum of trade and investment controls, including export controls, economic sanctions, anti-corruption and anti-money laundering, foreign direct investment, and customs. Her practice spans counseling, investigations, enforcement defense, and high-stakes regulatory approvals.</p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">She brings deep industry fluency across financial services, aviation, biotechnology and life sciences, energy and natural resources, advanced manufacturing, technology and software, and chemicals. She regularly designs and enhances global compliance programs, leads pre- and post-acquisition due diligence, conducts internal investigations, and represents clients before OFAC, BIS, DOJ, DDTC, CBP, and other agencies in licensing, enforcement, and inquiry matters.</p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">A leading CFIUS practitioner, she has also successfully guided numerous clients—both foreign and domestic—through the most complex and challenging CFIUS national security reviews and investigations, including the only reversal of a presidential block.</p></div>
