    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.25rem;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="box-sizing:inherit;outline:none;">Tom is a partner in the asset management group and leads the firm’s EMEA funds practice. He advises sponsors and institutional investors on the formation, fundraising, marketing and ongoing operations of private funds and fund managers across private equity, credit, real assets and impact strategies, including with respect to closed‑ended funds, evergreen funds and private wealth‑focused vehicles (including Part II UCIs and ELTIFs). He also has extensive experience in sponsor‑to‑sponsor M&amp;A, GP‑led secondaries (including continuation vehicles), joint ventures, separately managed accounts and co‑investments.</span></p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Tom is consistently recognised by clients and peers as a leading investment management lawyer, including in <em style="box-sizing:inherit;outline:none;"><em>The Legal 500</em></em> and <em style="box-sizing:inherit;outline:none;"><em>Chambers UK</em></em>. Directory feedback describes him as “absolutely awesome,” “the best funds legal adviser in London”&nbsp; and&nbsp; “at the forefront of funds lawyers in the UK.” Clients praise his “deep insights in the market,” “clarity of thinking” and ability to “protect clients while understanding the counterparty’s position and concerns and finding a common solution,” noting that he “combines deep legal expertise with a commercial mindset,” “doesn’t over complicate,” is “extremely responsive, commercial and practical,” is “clear in his timings and … really informative,” and “starts with the commercial objectives.” Clients also highlight his “collaborative ability, responsiveness and business sense/commerciality” and that he “consistently provides … invaluable high quality advice in a timely manner.” He is ranked “Highly Regarded” by <em style="box-sizing:inherit;outline:none;"><em>IFLR1000</em></em> and was named by <em style="box-sizing:inherit;outline:none;"><em>PEI’s Private Fund Manager</em></em> as one of the global private funds industry’s top 30 under 40.</p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Tom previously served on the BVCA’s Legal and Accounting Committee and Regulatory Committee, as well as on Invest Europe’s Regulatory Committee. Prior to joining Ropes &amp; Gray, he was an investment funds partner at another global law firm, before that serving in house as a senior in-house funds lawyer and Europe &amp; Africa Chief Compliance Officer at The Carlyle Group. Tom’s practice is strongly international and includes a six year period in New York.</p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="box-sizing:inherit;outline:none;">Representative clients include:</span></p><ul style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-block:1em;margin-bottom:0px;margin-right:0px;margin-top:1rem;orphans:2;outline:none;padding-inline-start:40px;padding:0px 0px 0px 2em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:0px;outline:none;"><p style="margin-left:0px;">3i Group</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Adams Street Partners</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Alcentra</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Baillie Gifford</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">BlackRock</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Bracebridge Capital</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">GCM Grosvenor Capital Management</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Goldman Sachs Asset Management</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">HarbourVest Partners</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">iCapital</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Incus Capital</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Intermediate Capital Group</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Limerston Capital Partners</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Nexus Point</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Partners Group</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">Siguler Guff &amp; Company</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:1em;margin-top:1em;outline:none;"><p style="margin-left:0px;">State Street</p></li><li style="box-sizing:inherit;list-style-type:disc;margin-bottom:0px;margin-top:1em;outline:none;"><p style="margin-left:0px;">Tillman Holdings</p></li></ul></div>
