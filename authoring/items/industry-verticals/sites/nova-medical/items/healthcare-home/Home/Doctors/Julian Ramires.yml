    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.25rem;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Sophisticated investors worldwide turn to Chris Agnoli, a partner based in London, for complex tax advice on p<span style="background-color:white;"><span style="box-sizing:inherit;outline:none;">rivate equity and M&amp;A deals, private investment fund structuring, and investment and finance matters</span></span>. Chris regularly works with <span style="background-color:white;"><span style="box-sizing:inherit;outline:none;">private equity funds,&nbsp;institutional investors, sovereign wealth funds, REITs and public companies on their most important UK and cross-border transactions. Clients appreciate Chris’s </span></span>ability to deliver clear, commercially focused tax guidance.<span style="background-color:white;box-sizing:inherit;outline:none;"></span></p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Clients also value Chris’s deep understanding of the UK and international tax landscape. Most recently, Chris has guided clients through highly complex transactions in the pharmaceutical, healthcare and healthcare technology sectors, as well as significant fund investments by institutional and sovereign clients. He has also advised on prime real estate and real estate development matters in the UK and throughout Europe.</p><p style="-webkit-text-stroke-width:0px;box-sizing:inherit;color:rgb(0, 0, 0);font-family:&quot;EB Garamond&quot;;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.25rem 0px 0px;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Chris is deeply committed to pro bono work and has been recognised with Ropes &amp; Gray’s outstanding pro bono contributor award for London. He currently plays a leading role in the firm’s efforts to help members of Britain’s “Windrush Generation” apply for government compensation, and also volunteers at the London office’s Domestic Violence and Family Law Clinic in the city’s East End.</p></div>
